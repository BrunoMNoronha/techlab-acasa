name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Runtime versions
        run: |
          node --version
          pnpm --version

      - name: Check tracked files for secret markers
        run: pnpm run check:secrets

      - name: Check tracked files for line endings
        run: pnpm run check:eol

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  database:
    name: Database migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supabase CLI version
        run: pnpm exec supabase --version

      - name: Start local Supabase
        run: pnpm run db:start

      - name: Reset database from migrations
        run: pnpm run db:reset

      - name: Lint database schema
        run: pnpm run db:lint

      - name: Run database tests
        run: pnpm run db:test

      - name: Test member administration authorization with Auth and Data API
        run: pnpm run test:integration:member-admin-auth

      - name: Stop local Supabase
        if: always()
        run: pnpm run db:stop
